<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Real-time competition judging system for AIDA freediving judges. Score all 8 disciplines, track penalties and DQs, export results.">

<meta property="og:description" content="Real-time competition judging system for AIDA freediving. All 8 disciplines, live scoring, penalty tracking, CSV export.">

<meta property="og:image:width" content="1200">

<style>
:root {
  --bg: #f0f2f6;
  --bg2: #e4e7ed;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --text: #14202e;
  --text2: #4a5568;
  --text3: #8a95a6;
  --accent: #0c7a6e;
  --accent-bg: #e6f5f2;
  --border: #d2d8e0;
  --border2: #e8ecf0;
  --white-card: #1a8a4a;
  --white-card-bg: #eafaf0;
  --yellow-card: #b86e14;
  --yellow-card-bg: #fef6eb;
  --red-card: #c03030;
  --red-card-bg: #fdeaea;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --shadow2: 0 2px 8px rgba(0,0,0,.1);
  --radius: 6px;
  --input-bg: #ffffff;
  --nav-bg: rgba(240,242,246,.92);
  --hover: #edf0f5;
  --focus: #0c7a6e44;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1117;--bg2:#161b22;--surface:#1c2230;--surface2:#232b3a;
  --text:#d8dee8;--text2:#8b95a8;--text3:#586070;
  --accent:#2cc4b4;--accent-bg:#152e2b;
  --border:#2a3346;--border2:#232b3a;
  --white-card:#4ade80;--white-card-bg:#0f2a1a;
  --yellow-card:#f0a840;--yellow-card-bg:#2a2210;
  --red-card:#f06060;--red-card-bg:#2a1414;
  --shadow:0 1px 3px rgba(0,0,0,.2);--shadow2:0 2px 8px rgba(0,0,0,.3);
  --input-bg:#232b3a;--nav-bg:rgba(13,17,23,.92);--hover:#232b3a;--focus:#2cc4b444;
}}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:.5rem .65rem;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);}
input[type="number"]{font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}

.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);background:var(--nav-bg);}
.app-title{font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.02em;}
.app-comp{font-size:.72rem;color:var(--text3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tabs{display:flex;gap:0;}
.tab-btn{padding:.5rem .85rem;font-size:.75rem;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-btn .badge{display:inline-block;background:var(--accent);color:#fff;font-size:.6rem;padding:.1rem .35rem;border-radius:8px;margin-left:.3rem;font-weight:700;min-width:16px;text-align:center;}

main{max-width:900px;margin:0 auto;padding:1rem;}
.page{display:none;}
.page.active{display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);}
.card+.card{margin-top:.75rem;}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem;}

.form-row{display:flex;gap:.75rem;margin-bottom:.6rem;align-items:end;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:.2rem;flex:1;min-width:140px;}
.form-group label{font-size:.7rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
.form-group-sm{max-width:120px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.5rem 1rem;border-radius:var(--radius);font-size:.8rem;font-weight:600;transition:all .15s;cursor:pointer;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-outline{border:1px solid var(--border);background:var(--surface);color:var(--text);}
.btn-outline:hover{background:var(--hover);border-color:var(--text3);}
.btn-danger{background:var(--red-card);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-sm{padding:.35rem .65rem;font-size:.72rem;}
.btn-lg{padding:.7rem 1.5rem;font-size:.9rem;min-height:48px;}
.btn-block{width:100%;}

.disc-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0;}
.disc-chip{display:inline-flex;align-items:center;gap:.25rem;padding:.3rem .6rem;border-radius:4px;font-size:.7rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);transition:all .15s;letter-spacing:.02em;user-select:none;}
.disc-chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
.disc-chip input{display:none;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-top:.5rem;}
table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;}
th{background:var(--surface2);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:.45rem .6rem;border-bottom:1px solid var(--border2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover{background:var(--hover);}
td .btn-sm{vertical-align:middle;}

.tag{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .4rem;border-radius:3px;letter-spacing:.02em;}
.tag-white{background:var(--white-card-bg);color:var(--white-card);border:1px solid var(--white-card);}
.tag-yellow{background:var(--yellow-card-bg);color:var(--yellow-card);border:1px solid var(--yellow-card);}
.tag-red{background:var(--red-card-bg);color:var(--red-card);border:1px solid var(--red-card);}
.tag-pending{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}

.judge-header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap;}
.athlete-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.athlete-name{font-size:1.1rem;font-weight:700;}
.athlete-detail{font-size:.8rem;color:var(--text2);}
.athlete-ap{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:1.5rem;font-weight:700;color:var(--accent);}
.athlete-ap-label{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

.mode-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:.75rem 0;}
.mode-btn{flex:1;padding:.55rem;font-size:.8rem;font-weight:600;text-align:center;transition:all .15s;}
.mode-btn.active-perf{background:var(--accent-bg);color:var(--accent);border-bottom:2px solid var(--accent);}
.mode-btn.active-dq{background:var(--red-card-bg);color:var(--red-card);border-bottom:2px solid var(--red-card);}

.penalty-row{display:flex;align-items:center;gap:.5rem;padding:.45rem .5rem;border:1px solid var(--border2);border-radius:4px;margin-bottom:.35rem;background:var(--surface2);}
.penalty-row label{flex:1;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.4rem;}
.penalty-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
.penalty-row input[type="number"]{width:60px;padding:.3rem .4rem;font-size:.8rem;}
.penalty-pts{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:.75rem;font-weight:700;color:var(--yellow-card);min-width:50px;text-align:right;}

.dq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.35rem;margin-top:.5rem;}
.dq-option{display:flex;align-items:center;gap:.4rem;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s;background:var(--surface);}
.dq-option:hover{border-color:var(--red-card);background:var(--red-card-bg);}
.dq-option.selected{border-color:var(--red-card);background:var(--red-card-bg);color:var(--red-card);}
.dq-option input{display:none;}

.tag-toggle{display:flex;gap:0;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.tag-toggle-btn{flex:1;padding:.5rem .75rem;font-size:.82rem;font-weight:700;text-align:center;transition:all .15s;min-width:70px;cursor:pointer;}
.tag-toggle-btn.yes{border-right:1px solid var(--border);}
.tag-toggle-btn.yes.active{background:var(--white-card-bg);color:var(--white-card);border-color:var(--white-card);}
.tag-toggle-btn.no.active{background:var(--red-card-bg);color:var(--red-card);border-color:var(--red-card);}

.score-preview{border:2px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;margin-top:.75rem;text-align:center;transition:border-color .2s,background .2s;}
.score-preview.card-white{border-color:var(--white-card);background:var(--white-card-bg);}
.score-preview.card-yellow{border-color:var(--yellow-card);background:var(--yellow-card-bg);}
.score-preview.card-red{border-color:var(--red-card);background:var(--red-card-bg);}
.score-number{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:2rem;font-weight:700;line-height:1.1;}
.score-label{font-size:.7rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.15rem;}
.score-breakdown{font-size:.75rem;color:var(--text2);margin-top:.25rem;font-family:"SF Mono","Cascadia Mono",Consolas,monospace;}
.score-card-label{display:inline-block;font-size:.85rem;font-weight:800;margin-top:.35rem;letter-spacing:.06em;text-transform:uppercase;}

.confirm-btn{margin-top:.75rem;padding:.8rem 1.5rem;font-size:1rem;font-weight:700;border-radius:var(--radius);width:100%;min-height:52px;transition:all .15s;letter-spacing:.02em;}
.confirm-btn.card-white{background:var(--white-card);color:#fff;}
.confirm-btn.card-yellow{background:var(--yellow-card);color:#fff;}
.confirm-btn.card-red{background:var(--red-card);color:#fff;}
.confirm-btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:var(--shadow2);}
.confirm-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.queue-item{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border:1px solid var(--border2);border-radius:var(--radius);margin-bottom:.35rem;background:var(--surface);cursor:pointer;transition:all .15s;}
.queue-item:hover{border-color:var(--accent);background:var(--accent-bg);}
.queue-item.judged{opacity:.65;}
.queue-name{font-weight:600;font-size:.85rem;flex:1;}
.queue-country{font-size:.72rem;color:var(--text2);font-weight:600;}
.queue-ap{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:.82rem;font-weight:700;color:var(--accent);}

.stat-bar{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap;}
.stat-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.5rem .75rem;text-align:center;min-width:80px;}
.stat-val{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:1.15rem;font-weight:700;color:var(--accent);}
.stat-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}

.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:.85rem;}

.section-label{font-size:.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--border2);}

.sta-time-row{display:flex;gap:.5rem;align-items:end;}
.sta-time-row .form-group{min-width:60px;flex:none;}

@media(max-width:700px){
  main{padding:.75rem;}
  .form-row{flex-direction:column;gap:.5rem;}
  .form-group{min-width:0;}
  .form-group-sm{max-width:none;}
  .athlete-banner{flex-direction:column;align-items:flex-start;gap:.5rem;}
  .tab-btn{padding:.45rem .55rem;font-size:.68rem;}
  .dq-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div>
      <div class="app-title">AIDA Judge System</div>
      <div class="app-comp" id="header-comp"></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main>
    <div id="page-setup" class="page"></div>
    <div id="page-athletes" class="page"></div>
    <div id="page-judge" class="page"></div>
    <div id="page-results" class="page"></div>
  </main>
</div>

<script>
const DISC = {
  CWT:{type:'depth',label:'CWT',full:'Constant Weight',pts:1,unit:'m',hasTag:true,hasGrab:true},
  CWTB:{type:'depth',label:'CWTB',full:'CW Bifins',pts:1,unit:'m',hasTag:true,hasGrab:true},
  CNF:{type:'depth',label:'CNF',full:'No Fins',pts:1,unit:'m',hasTag:true,hasGrab:true},
  FIM:{type:'depth',label:'FIM',full:'Free Immersion',pts:1,unit:'m',hasTag:true,hasGrab:false},
  DYN:{type:'dynamic',label:'DYN',full:'Dynamic Fins',pts:.5,unit:'m',hasTag:false,hasGrab:false},
  DYNB:{type:'dynamic',label:'DYNB',full:'Dynamic Bifins',pts:.5,unit:'m',hasTag:false,hasGrab:false},
  DNF:{type:'dynamic',label:'DNF',full:'Dynamic No Fins',pts:.5,unit:'m',hasTag:false,hasGrab:false},
  STA:{type:'static',label:'STA',full:'Static Apnea',pts:.2,unit:'s',hasTag:false,hasGrab:false}
};

const PENALTIES_BY_TYPE = {
  depth:[
    {code:'EARLY',label:'Early Start',input:'seconds',calc:s=>Math.ceil(s/5)},
    {code:'GRAB',label:'Grab',input:'count',per:5,discs:['CWT','CWTB','CNF']},
    {code:'LANYARD',label:'Lanyard Removed',input:'toggle',pts:10}
  ],
  dynamic:[
    {code:'EARLY',label:'Early Start',input:'seconds',calc:s=>Math.ceil(s/5)},
    {code:'LATE',label:'Late Start',input:'seconds',calc:s=>Math.ceil(s/5)},
    {code:'START',label:'No Wall Touch (Start)',input:'toggle',pts:5},
    {code:'TURN',label:'No Wall Touch (Turn)',input:'count',per:5},
    {code:'PULL',label:'Pull on Support',input:'count',per:5}
  ],
  static:[
    {code:'EARLY',label:'Early Start',input:'seconds',calc:s=>Math.ceil(s/5)},
    {code:'LATE',label:'Late Start',input:'seconds',calc:s=>Math.ceil(s/5)}
  ]
};

const DQ_COMMON = [
  {code:'DQBO',label:'Blackout'},
  {code:'DQSP',label:'Surface Protocol'},
  {code:'DQAIRWAYS',label:'Airways Below Surface'},
  {code:'DQTOUCH',label:'Touch / Physical Help'},
  {code:'DQLATE',label:'Late Start (>30s)'},
];
const DQ_BY_TYPE = {
  depth:[
    {code:'DQPULL',label:'Pull on Line',discs:['CWT','CWTB','CNF']},
    {code:'DQWEIGHT',label:'Weight Variation'},
    {code:'DQDOLPHIN',label:'Dolphin Kick',discs:['CWTB']},
    {code:'DQREDESC',label:'Re-descending'},
    {code:'DQFLOT',label:'Flotation Assist'},
    {code:'DQCOACH',label:'Coach Immersion'},
    {code:'DQOTHER',label:'Other'}
  ],
  dynamic:[
    {code:'DQDOLPHIN',label:'Dolphin Kick',discs:['DYNB']},
    {code:'DQARM',label:'Arm Recovery Above Surface'},
    {code:'DQSURFACE',label:'Full Surface Length'},
    {code:'DQWALL',label:'>1m Short at Turn'},
    {code:'DQAIRSTART',label:'Airway >1.5m from Wall'},
    {code:'DQFLOT',label:'Flotation Assist'},
    {code:'DQCOACH',label:'Coach Immersion'},
    {code:'DQOTHER',label:'Other'}
  ],
  static:[
    {code:'DQFLOT',label:'Flotation Assist'},
    {code:'DQCOACH',label:'Coach Immersion'},
    {code:'DQOTHER',label:'Other'}
  ]
};

const STORE_KEY = 'aida-judge-v1';
let state = loadState();
let activeTab = 'setup';
let judgeState = {disc:null,athleteId:null,mode:'queue'};

function defaultState(){
  return {
    competition:{name:'',date:'',location:'',disciplines:['CWT','CWTB','CNF','FIM']},
    athletes:[],
    performances:[]
  };
}
function loadState(){
  try{const s=localStorage.getItem(STORE_KEY);return s?JSON.parse(s):defaultState();}
  catch(e){return defaultState();}
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function uid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}

function calcScore(disc,ap,rp,tagDelivered,extraPenalties){
  const cfg=DISC[disc];
  if(!cfg||rp==null||rp===''||isNaN(rp))return null;
  let base=0,penTotal=0,details=[];
  const rpNum=parseFloat(rp);

  if(cfg.type==='depth'){
    if(tagDelivered){
      base=ap*cfg.pts;
    } else {
      let rpF=Math.floor(rpNum);
      rpF=Math.min(rpF,ap);
      base=rpF*cfg.pts;
      penTotal+=1;details.push({code:'TAG',pts:1});
      if(rpF<ap){const u=(ap-rpF)*cfg.pts;penTotal+=u;details.push({code:'UNDER AP',pts:u});}
    }
  } else if(cfg.type==='dynamic'){
    let rpF=Math.floor(rpNum);
    base=rpF*cfg.pts;
    if(rpF<ap){const u=(ap-rpF)*cfg.pts;penTotal+=u;details.push({code:'UNDER AP',pts:u});}
  } else if(cfg.type==='static'){
    let rpS=Math.floor(rpNum);
    base=rpS*cfg.pts;
    if(rpS<ap){const u=(ap-rpS)*cfg.pts;penTotal+=u;details.push({code:'UNDER AP',pts:u});}
  }

  for(const p of extraPenalties){
    if(p.pts>0){penTotal+=p.pts;details.push({code:p.code,pts:p.pts});}
  }

  const final=Math.max(0,base-penTotal);
  const card=penTotal>0?'yellow':'white';
  return {base,penTotal,final,card,details};
}

function fmtPts(n){if(n==null)return'-';return Number.isInteger(n)?n.toString():n.toFixed(1);}
function secToTime(s){if(s==null||isNaN(s))return'-';const m=Math.floor(s/60);const sec=s%60;return m+"'"+(sec<10?'0':'')+sec+'"';}
function timeToSec(m,s){return(parseInt(m)||0)*60+(parseInt(s)||0);}
function rpDisplay(disc,rp){
  if(rp==null||rp===''||isNaN(rp))return'-';
  const cfg=DISC[disc];
  if(cfg.type==='static')return secToTime(Math.floor(rp));
  return Math.floor(rp)+'m';
}
function apDisplay(disc,ap){
  if(ap==null)return'-';
  const cfg=DISC[disc];
  if(cfg.type==='static')return secToTime(ap);
  return ap+'m';
}

function render(){
  renderTabs();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+activeTab);
  if(page){page.classList.add('active');}
  const comp=state.competition;
  document.getElementById('header-comp').textContent=comp.name||(comp.date?comp.date:'No competition set');
  switch(activeTab){
    case'setup':renderSetup();break;
    case'athletes':renderAthletes();break;
    case'judge':renderJudge();break;
    case'results':renderResults();break;
  }
}

function renderTabs(){
  const pending=state.athletes.filter(a=>
    state.competition.disciplines.some(d=>
      a.aps&&a.aps[d]!=null&&!state.performances.find(p=>p.athleteId===a.id&&p.discipline===d)
    )
  ).length;
  const tabs=[
    {id:'setup',label:'Setup'},
    {id:'athletes',label:'Athletes'},
    {id:'judge',label:'Judge',badge:pending||null},
    {id:'results',label:'Results'}
  ];
  document.getElementById('tabs').innerHTML=tabs.map(t=>
    `<button class="tab-btn${activeTab===t.id?' active':''}" data-tab="${t.id}">${t.label}${t.badge?`<span class="badge">${t.badge}</span>`:''}</button>`
  ).join('');
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
}

function renderSetup(){
  const c=state.competition;
  document.getElementById('page-setup').innerHTML=`
    <div class="card">
      <div class="card-title">Competition Details</div>
      <div class="form-row">
        <div class="form-group"><label>Competition Name</label><input id="s-name" value="${esc(c.name)}" placeholder="e.g. Red Sea Depth Open 2026"></div>
      </div>
      <div class="form-row">
        <div class="form-group form-group-sm"><label>Date</label><input id="s-date" type="date" value="${esc(c.date)}"></div>

      </div>
    </div>

          <label class="disc-chip${c.disciplines.includes(d)?' active':''}">

    </div>
  `;
  const save_=()=>{

function deleteAthlete(id){
  if(!confirm('Delete this athlete and all their performances?'))return;
  state.athletes=state.athletes.filter(a=>a.id!==id);
  state.performances=state.performances.filter(p=>p.athleteId!==id);
  save();render();
}

function renderJudge(){
  const page=document.getElementById('page-judge');
  const discs=state.competition.disciplines;
  if(discs.length===0){page.innerHTML='<div class="empty-state">No disciplines selected. Go to Setup first.</div>';return;}
  if(!judgeState.disc||!discs.includes(judgeState.disc))judgeState.disc=discs[0];

  if(judgeState.mode==='form'&&judgeState.athleteId){
    renderJudgeForm(page);
  } else {
    renderJudgeQueue(page);
  }
}

function renderJudgeQueue(page){
  const discs=state.competition.disciplines;
  const d=judgeState.disc;
  const athletes=state.athletes.filter(a=>a.aps&&a.aps[d]!=null);
  const sorted=[...athletes].sort((a,b)=>(a.aps[d]||0)-(b.aps[d]||0));

  page.innerHTML=`
    <div class="judge-header">
      <div class="disc-chips">${discs.map(dd=>`<span class="disc-chip${dd===d?' active':''}" data-jdisc="${dd}">${dd}</span>`).join('')}</div>
    </div>
    ${sorted.length===0?'<div class="empty-state">No athletes registered for '+d+'. Add athletes and APs first.</div>':
    sorted.map(a=>{
      const perf=state.performances.find(p=>p.athleteId===a.id&&p.discipline===d);
      const statusTag=perf?(perf.card==='red'?'<span class="tag tag-red">DQ</span>':perf.card==='yellow'?`<span class="tag tag-yellow">${fmtPts(perf.final)} pts</span>`:`<span class="tag tag-white">${fmtPts(perf.final)} pts</span>`):'<span class="tag tag-pending">Pending</span>';
      return `<div class="queue-item${perf?' judged':''}" data-qid="${a.id}">
        <span class="queue-name">${esc(a.name)}</span>
        <span class="queue-country">${esc(a.country)}</span>
        <span class="queue-ap">${apDisplay(d,a.aps[d])}</span>

      </div>`;
    }).join('')}
  `;

  page.querySelectorAll('[data-jdisc]').forEach(el=>el.onclick=()=>{judgeState.disc=el.dataset.jdisc;render();});
  page.querySelectorAll('[data-qid]').forEach(el=>el.onclick=()=>{judgeState.athleteId=el.dataset.qid;judgeState.mode='form';render();});
}

  const penDefs=(PENALTIES_BY_TYPE[cfg.type]||[]).filter(p=>!p.discs||p.discs.includes(d));

        <div class="athlete-detail">${cfg.full} &middot; ${athlete.gender==='M'?'Male':'Female'}</div>
      </div>

      </div>
      <div class="form-group" style="margin-top:.5rem;"><label>DQ Note</label><input id="j-dqnote" value="${existing?esc(existing.dqNote||''):''}" placeholder="Optional details"></div>

      </div>
    </div>`;

function renderPenaltyRow(pDef,existing){
  const ep=existing?.additionalPenalties?.find(p=>p.code===pDef.code);
  const checked=ep?true:false;
  const val=ep?ep.value:'';
  let inputHtml='';
  if(pDef.input==='seconds')inputHtml=`<input type="number" class="pen-val" data-pen="${pDef.code}" min="1" max="30" value="${val}" placeholder="sec" ${checked?'':'disabled'}>`;
  else if(pDef.input==='count')inputHtml=`<input type="number" class="pen-val" data-pen="${pDef.code}" min="1" max="20" value="${val||1}" ${checked?'':'disabled'}>`;
  return `<div class="penalty-row">
    <label><input type="checkbox" class="pen-check" data-pen="${pDef.code}" ${checked?'checked':''}> ${pDef.label}</label>
    ${inputHtml}
    <span class="penalty-pts" data-pen-pts="${pDef.code}">${ep?'-'+ep.pts+' pts':''}</span>
  </div>`;
}

function getFormData(){
  const d=judgeState.disc;
  const cfg=DISC[d];
  const athlete=state.athletes.find(a=>a.id===judgeState.athleteId);
  const ap=athlete.aps[d];
  const isDQ=document.querySelector('.mode-btn.active-dq')!==null;

  if(isDQ){
    const dqRadio=document.querySelector('input[name="dqcode"]:checked');
    return {
      disc:d,ap,isDQ:true,
      dqCode:dqRadio?dqRadio.value:null,
      dqNote:document.getElementById('j-dqnote')?.value||'',
      notes:document.getElementById('j-notes')?.value||'',
      rp:null,tagDelivered:null,additionalPenalties:[],
      base:0,penTotal:0,final:0,card:'red',
      staT1:null,staT2:null
    };
  }

  let rp=null,staT1=null,staT2=null;
  if(cfg.type==='static'){
    const t1m=parseFloat(document.getElementById('j-t1m')?.value)||0;
    const t1s=parseFloat(document.getElementById('j-t1s')?.value)||0;
    const t2m=parseFloat(document.getElementById('j-t2m')?.value)||0;
    const t2s=parseFloat(document.getElementById('j-t2s')?.value)||0;
    staT1=t1m*60+t1s;staT2=t2m*60+t2s;
    if(staT1>0||staT2>0){
      const avg=(staT1+staT2)/2;
      rp=Math.floor(avg);
      const avgEl=document.getElementById('j-sta-avg');
      if(avgEl)avgEl.textContent=`Average: ${secToTime(rp)} (${avg.toFixed(2)}s)`;
    }
  } else {
    const rpInp=document.getElementById('j-rp');
    rp=rpInp?parseFloat(rpInp.value):null;
    if(isNaN(rp))rp=null;
  }

  let tagDelivered=null;
  if(cfg.hasTag){
    const yesBtn=document.querySelector('.tag-toggle-btn.yes.active');
    const noBtn=document.querySelector('.tag-toggle-btn.no.active');
    if(yesBtn)tagDelivered=true;
    else if(noBtn)tagDelivered=false;
  }

  const penDefs=(PENALTIES_BY_TYPE[cfg.type]||[]).filter(p=>!p.discs||p.discs.includes(d));
  const additionalPenalties=[];
  for(const pDef of penDefs){
    const cb=document.querySelector(`.pen-check[data-pen="${pDef.code}"]`);
    if(!cb||!cb.checked)continue;
    const valInp=document.querySelector(`.pen-val[data-pen="${pDef.code}"]`);
    let val=valInp?parseFloat(valInp.value)||0:0;
    let pts=0;
    if(pDef.input==='toggle')pts=pDef.pts;
    else if(pDef.input==='seconds'&&pDef.calc)pts=pDef.calc(val);
    else if(pDef.input==='count')pts=(val||1)*pDef.per;
    additionalPenalties.push({code:pDef.code,value:val,pts});
  }

  const score=calcScore(d,ap,rp,tagDelivered,additionalPenalties);

  return {
    disc:d,ap,rp,tagDelivered,additionalPenalties,isDQ:false,dqCode:null,dqNote:'',
    notes:document.getElementById('j-notes')?.value||'',
    base:score?score.base:null,penTotal:score?score.penTotal:0,
    final:score?score.final:null,card:score?score.card:null,
    staT1,staT2,scoreDetails:score?score.details:[]
  };
}

function updateScorePreview(){
  const data=getFormData();
  const preview=document.getElementById('j-score-preview');
  const confirmBtn=document.getElementById('j-confirm');
  if(!preview||!confirmBtn)return;

  const penDefs=PENALTIES_BY_TYPE[DISC[judgeState.disc].type]||[];
  for(const pDef of penDefs){
    const cb=document.querySelector(`.pen-check[data-pen="${pDef.code}"]`);
    const valInp=document.querySelector(`.pen-val[data-pen="${pDef.code}"]`);
    const ptsEl=document.querySelector(`[data-pen-pts="${pDef.code}"]`);
    if(valInp)valInp.disabled=!(cb&&cb.checked);
    if(ptsEl&&cb){
      if(!cb.checked){ptsEl.textContent='';continue;}
      let val=valInp?parseFloat(valInp.value)||0:0;
      let pts=0;
      if(pDef.input==='toggle')pts=pDef.pts;
      else if(pDef.input==='seconds'&&pDef.calc)pts=pDef.calc(val);
      else if(pDef.input==='count')pts=(val||1)*(pDef.per||0);
      ptsEl.textContent=pts>0?'-'+pts+' pts':'';
    }
  }

  if(data.isDQ){
    const hasCode=!!data.dqCode;
    preview.className='score-preview card-red';
    preview.innerHTML=`
      <div class="score-label">Score</div>
      <div class="score-number" style="color:var(--red-card);">0</div>
      <div class="score-card-label" style="color:var(--red-card);">RED CARD${data.dqCode?' — '+data.dqCode:''}</div>
    `;
    confirmBtn.className='confirm-btn card-red';
    confirmBtn.textContent='Confirm DQ & Save';
    confirmBtn.disabled=!hasCode;
    return;
  }

  if(data.final==null||data.rp==null){
    preview.className='score-preview';
    preview.innerHTML='<div class="score-label" style="padding:1rem 0;">Enter performance data above</div>';
    confirmBtn.disabled=true;
    confirmBtn.className='confirm-btn';
    confirmBtn.textContent='Confirm & Save';
    return;
  }

  if(DISC[judgeState.disc].hasTag&&data.tagDelivered==null){
    preview.className='score-preview';
    preview.innerHTML='<div class="score-label" style="padding:1rem 0;">Select tag delivered YES or NO</div>';
    confirmBtn.disabled=true;
    return;
  }

  const c=data.card;
  const color=c==='white'?'var(--white-card)':'var(--yellow-card)';
  const detailStr=data.scoreDetails?.length?data.scoreDetails.map(d=>`${d.code}: -${fmtPts(d.pts)}`).join(' | '):'Clean performance';

  preview.className=`score-preview card-${c}`;
  preview.innerHTML=`
    <div class="score-label">Score</div>
    <div class="score-number" style="color:${color};">${fmtPts(data.final)}</div>
    <div class="score-breakdown">${data.penTotal>0?`Base: ${fmtPts(data.base)} − Penalties: ${fmtPts(data.penTotal)}`:detailStr}</div>
    <div class="score-card-label" style="color:${color};">${c==='white'?'WHITE CARD':'YELLOW CARD'}</div>
  `;
  confirmBtn.className=`confirm-btn card-${c}`;
  confirmBtn.textContent=`Confirm ${c==='white'?'White':'Yellow'} Card & Save`;
  confirmBtn.disabled=false;
}

function savePerformance(){
  const data=getFormData();
  const athlete=state.athletes.find(a=>a.id===judgeState.athleteId);
  if(!athlete)return;

  const existingIdx=state.performances.findIndex(p=>p.athleteId===athlete.id&&p.discipline===data.disc);
  const perf={
    id:existingIdx>=0?state.performances[existingIdx].id:uid(),
    athleteId:athlete.id,
    discipline:data.disc,
    ap:data.ap,rp:data.rp,
    tagDelivered:data.tagDelivered,
    additionalPenalties:data.additionalPenalties,
    isDQ:data.isDQ,dqCode:data.dqCode,dqNote:data.dqNote,
    base:data.base,penTotal:data.penTotal,final:data.final,card:data.card,
    notes:data.notes,judgedAt:new Date().toISOString(),
    staT1:data.staT1,staT2:data.staT2
  };
  if(existingIdx>=0)state.performances[existingIdx]=perf;
  else state.performances.push(perf);
  save();
  judgeState.mode='queue';judgeState.athleteId=null;
  render();
}

function renderResults(){
  const page=document.getElementById('page-results');
  const discs=state.competition.disciplines;
  if(discs.length===0){page.innerHTML='<div class="empty-state">No disciplines configured.</div>';return;}

  if(!judgeState.resultDisc||!discs.includes(judgeState.resultDisc))judgeState.resultDisc=discs[0];
  const d=judgeState.resultDisc;
  const cfg=DISC[d];

  const perfs=state.performances.filter(p=>p.discipline===d);
  const whites=perfs.filter(p=>p.card==='white').length;
  const yellows=perfs.filter(p=>p.card==='yellow').length;
  const reds=perfs.filter(p=>p.card==='red').length;

  const ranked=[...perfs].sort((a,b)=>{
    if(a.card==='red'&&b.card!=='red')return 1;
    if(b.card==='red'&&a.card!=='red')return -1;
    if(b.final!==a.final)return b.final-a.final;
    const aDiff=Math.abs((a.ap||0)-(a.rp!=null?Math.floor(a.rp):0));
    const bDiff=Math.abs((b.ap||0)-(b.rp!=null?Math.floor(b.rp):0));
    return aDiff-bDiff;
  });

  let pos=0,prevFinal=null,prevDiff=null;
  ranked.forEach((p,i)=>{
    if(p.card==='red'){p._pos='—';return;}
    const diff=Math.abs((p.ap||0)-(p.rp!=null?Math.floor(p.rp):0));
    if(p.final!==prevFinal||diff!==prevDiff)pos=i+1;
    p._pos=pos;
    prevFinal=p.final;prevDiff=diff;
  });

  page.innerHTML=`
    <div class="judge-header">
      <div class="disc-chips">${discs.map(dd=>`<span class="disc-chip${dd===d?' active':''}" data-rdisc="${dd}">${dd}</span>`).join('')}</div>
      <button class="btn btn-outline btn-sm" id="r-export">Export CSV</button>
    </div>
    <div class="stat-bar">
      <div class="stat-item"><div class="stat-val">${perfs.length}</div><div class="stat-lbl">Judged</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--white-card)">${whites}</div><div class="stat-lbl">White</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--yellow-card)">${yellows}</div><div class="stat-lbl">Yellow</div></div>
      <div class="stat-item"><div class="stat-val" style="color:var(--red-card)">${reds}</div><div class="stat-lbl">Red</div></div>
    </div>
    ${ranked.length===0?'<div class="empty-state">No performances judged yet for '+d+'.</div>':
    `<div class="table-wrap"><table>
      <thead><tr>
        <th>Pos</th><th>Name</th><th>Country</th><th>Gender</th><th>AP</th><th>RP</th><th>Penalties</th><th>Card</th><th>Points</th>
      </tr></thead>
      <tbody>${ranked.map(p=>{
        const a=state.athletes.find(x=>x.id===p.athleteId);
        if(!a)return '';
        const penStr=p.isDQ?(p.dqCode||'DQ'):
          (p.additionalPenalties||[]).filter(x=>x.pts>0).map(x=>x.code).join(', ')+
          (!p.tagDelivered&&cfg.hasTag&&!p.isDQ?' TAG':'');
        const cardTag=p.card==='white'?'<span class="tag tag-white">WHITE</span>':
          p.card==='yellow'?'<span class="tag tag-yellow">YELLOW</span>':
          '<span class="tag tag-red">RED</span>';
        return `<tr>
          <td><strong>${p._pos}</strong></td>
          <td>${esc(a.name)}</td>
          <td>${esc(a.country)}</td>
          <td>${a.gender}</td>
          <td>${apDisplay(d,p.ap)}</td>
          <td>${p.isDQ?'—':rpDisplay(d,p.rp)}</td>
          <td style="font-size:.72rem;">${penStr.trim()||'—'}</td>
          <td>${cardTag}</td>
          <td><strong>${fmtPts(p.final)}</strong></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}
  `;

  page.querySelectorAll('[data-rdisc]').forEach(el=>el.onclick=()=>{judgeState.resultDisc=el.dataset.rdisc;render();});
  document.getElementById('r-export')?.addEventListener('click',()=>exportCSV(d));
}

function exportCSV(disc){
  const cfg=DISC[disc];
  const perfs=state.performances.filter(p=>p.discipline===disc);
  if(perfs.length===0){alert('No performances to export.');return;}

  const ranked=[...perfs].sort((a,b)=>{
    if(a.card==='red'&&b.card!=='red')return 1;
    if(b.card==='red'&&a.card!=='red')return -1;
    if(b.final!==a.final)return b.final-a.final;
    const aDiff=Math.abs((a.ap||0)-(a.rp!=null?Math.floor(a.rp):0));
    const bDiff=Math.abs((b.ap||0)-(b.rp!=null?Math.floor(b.rp):0));
    return aDiff-bDiff;
  });

  let pos=0,prevF=null,prevD=null;
  const rows=[['Position','Name','Country','Gender','Discipline','AP','RP','Tag','Penalties','DQ Code','Card','Points','Notes']];
  ranked.forEach((p,i)=>{
    const a=state.athletes.find(x=>x.id===p.athleteId);
    if(!a)return;
    if(p.card!=='red'){
      const diff=Math.abs((p.ap||0)-(p.rp!=null?Math.floor(p.rp):0));
      if(p.final!==prevF||diff!==prevD)pos=i+1;
      prevF=p.final;prevD=diff;
    }
    const penStr=p.isDQ?'':(p.additionalPenalties||[]).filter(x=>x.pts>0).map(x=>`${x.code}(-${x.pts})`).join('; ');
    rows.push([
      p.card==='red'?'DQ':pos,
      a.name,a.country,a.gender,disc,
      cfg.type==='static'?secToTime(p.ap):p.ap,
      p.rp!=null?(cfg.type==='static'?secToTime(Math.floor(p.rp)):p.rp):'',
      cfg.hasTag?(p.tagDelivered?'YES':'NO'):'N/A',
      penStr,p.dqCode||'',
      p.card?.toUpperCase()||'',
      p.final!=null?p.final:'0',
      p.notes||''
    ]);
  });

  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  const compName=(state.competition.name||'competition').replace(/[^a-zA-Z0-9]/g,'_');
  link.download=`${compName}_${disc}_results.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

if(!judgeState.resultDisc)judgeState.resultDisc=state.competition.disciplines[0]||null;
render();
</script>
</body>
</html>
